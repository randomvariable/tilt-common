apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: cuda-test
    image: nvidia/cuda:12.0.0-base-ubuntu22.04
    command:
    - /bin/bash
    - -c
    - |
      echo "=== GPU Access Test ==="
      nvidia-smi
      echo ""
      echo "=== eBPF Filesystem Access Test ==="
      echo "Checking debugfs..."
      ls -la /sys/kernel/debug/ || echo "debugfs not accessible"
      echo ""
      echo "Checking tracefs..."
      ls -la /sys/kernel/tracing/ || echo "tracefs not accessible"
      echo ""
      echo "=== Test Complete ==="
    resources:
      limits:
        nvidia.com/gpu: 1
    securityContext:
      # Profiling tools need privileged access to kernel tracing facilities
      privileged: true
    volumeMounts:
    - name: debugfs
      mountPath: /sys/kernel/debug
      readOnly: true
    - name: tracefs
      mountPath: /sys/kernel/tracing
      readOnly: true
  volumes:
  - name: debugfs
    hostPath:
      path: /sys/kernel/debug
      type: Directory
  - name: tracefs
    hostPath:
      path: /sys/kernel/tracing
      type: Directory
