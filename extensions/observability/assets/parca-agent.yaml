#
# Parca Agent DaemonSet for local development.
# Requires a real Linux kernel with eBPF support (not supported on kind/Docker Desktop).
# Enable via parca_agent: True in enable_observability() config.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: parca-agent
  namespace: __NAMESPACE__
  labels:
    app: parca-agent
    app.kubernetes.io/managed-by: tilt-observability
spec:
  selector:
    matchLabels:
      app: parca-agent
  template:
    metadata:
      labels:
        app: parca-agent
        app.kubernetes.io/managed-by: tilt-observability
    spec:
      serviceAccountName: parca
      hostPID: true
      containers:
        - name: parca-agent
          image: __PARCA_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - /bin/parca-agent
          args:
            - "--remote-store-address=parca-server.__NAMESPACE__.svc.cluster.local:7070"
            - "--remote-store-insecure"
            - "--node=$(NODE_NAME)"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - IPC_LOCK
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: false
            - name: bpffs
              mountPath: /sys/fs/bpf
              readOnly: false
            - name: containerd-socket
              mountPath: __CONTAINERD_SOCKET__
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: containerd-socket
          hostPath:
            path: __CONTAINERD_SOCKET__
