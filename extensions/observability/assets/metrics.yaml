#
# VictoriaMetrics single-node deployment for local development.
# Provides Prometheus-compatible metrics storage with OpenTelemetry ingestion.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: __NAMESPACE__
  labels:
    app: victoriametrics
    app.kubernetes.io/managed-by: tilt-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
        app.kubernetes.io/managed-by: tilt-observability
    spec:
      containers:
        - name: victoriametrics
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - "-retentionPeriod=1d"
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: __NAMESPACE__
  labels:
    app: victoriametrics
    app.kubernetes.io/managed-by: tilt-observability
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
      protocol: TCP
