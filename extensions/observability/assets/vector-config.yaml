#
# Vector configuration for container log collection.
# Collects Kubernetes container logs and ships them to VictoriaLogs.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: __NAMESPACE__
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
data:
  vector.yaml: |
    api:
      enabled: true
      address: "0.0.0.0:8686"

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        self_node_name: "${VECTOR_SELF_NODE_NAME}"

    transforms:
      enrich_logs:
        type: remap
        inputs:
          - kubernetes_logs
        source: |
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
          .app = to_string(.kubernetes.pod_labels."app") ?? ""
          del(.kubernetes)
          del(.file)
          del(.source_type)

    sinks:
      victorialogs:
        type: elasticsearch
        inputs:
          - enrich_logs
        endpoints:
          - "http://__LOGS_SERVICE__:9428/insert/elasticsearch/"
        api_version: v8
        mode: bulk
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: "namespace,pod,container,node,app"
