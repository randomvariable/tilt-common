name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing tools (attempt ${attempt}/3)..."
            if go run mage.go tools:install; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Tool install failed; retrying in 15s..."
              sleep 15
            fi
          done
          echo "Tool install failed after 3 attempts"
          exit 1

      - name: Build
        run: go run mage.go build:all

      - name: Test
        run: go run mage.go test:unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing tools (attempt ${attempt}/3)..."
            if go run mage.go tools:install; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Tool install failed; retrying in 15s..."
              sleep 15
            fi
          done
          echo "Tool install failed after 3 attempts"
          exit 1

      - name: Lint
        run: go run mage.go lint:all
