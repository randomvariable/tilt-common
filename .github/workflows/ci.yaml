name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  k3d-gpu:
    name: k3d-gpu extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/k3d-gpu/magefiles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/k3d-gpu/magefiles/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -timeout=120s -race

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/k3d-gpu/magefiles/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: extensions/k3d-gpu/magefiles
          args: --config ../../.golangci.yml
