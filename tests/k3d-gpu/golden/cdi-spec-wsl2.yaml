cdiVersion: 0.5.0
kind: nvidia.com/gpu
devices:
  - name: all
  - name: "0"
  - name: GPU-UUID-PLACEHOLDER
containerEdits:
  env:
    - NVIDIA_VISIBLE_DEVICES=void
  hooks:
    - hookName: createContainer
      path: /usr/bin/nvidia-cdi-hook
      args:
        - nvidia-cdi-hook
        - create-symlinks
        - --link
        - DRIVER_STORE_PLACEHOLDER/nvidia-smi::/usr/bin/nvidia-smi
    - hookName: createContainer
      path: /usr/bin/nvidia-cdi-hook
      args:
        - nvidia-cdi-hook
        - update-ldcache
        - --folder
        - DRIVER_STORE_PLACEHOLDER
        - --folder
        - LIBDXCORE_DIR_PLACEHOLDER
  mounts:
    - hostPath: /dev/dxg
      containerPath: /dev/dxg
    - hostPath: DRIVER_STORE_PLACEHOLDER
      containerPath: DRIVER_STORE_PLACEHOLDER
      options:
        - ro
    - hostPath: LIBDXCORE_PATH_PLACEHOLDER
      containerPath: LIBDXCORE_PATH_PLACEHOLDER
      options:
        - ro
