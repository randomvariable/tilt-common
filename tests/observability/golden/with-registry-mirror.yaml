  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  strategy: {}
  template:
    metadata:
      labels:
        app: victorialogs
        app.kubernetes.io/managed-by: tilt-observability
    spec:
      containers:
      - args:
        - -retentionPeriod=1d
        image: victoriametrics/victoria-logs:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: 9428
          initialDelaySeconds: 10
          periodSeconds: 30
        name: victorialogs
        ports:
        - containerPort: 9428
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 9428
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi

