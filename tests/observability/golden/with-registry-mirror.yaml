apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
  name: vector
  namespace: observability
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
        app.kubernetes.io/managed-by: tilt-observability
    spec:
      containers:
      - args:
        - --config-dir
        - /etc/vector/
        env:
        - name: VECTOR_LOG
          value: info
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: timberio/vector:latest-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 10
          periodSeconds: 30
        name: vector
        ports:
        - containerPort: 8686
          name: api
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/vector/
          name: config
          readOnly: true
        - mountPath: /var/lib/vector
          name: data
        - mountPath: /var/log
          name: var-log
          readOnly: true
        - mountPath: /var/lib/docker/containers
          name: var-lib-docker
          readOnly: true
      serviceAccountName: vector
      volumes:
      - configMap:
          name: vector-config
        name: config
      - hostPath:
          path: /var/lib/vector
          type: DirectoryOrCreate
        name: data
      - hostPath:
          path: /var/log
          type: Directory
        name: var-log
      - hostPath:
          path: /var/lib/docker/containers
          type: DirectoryOrCreate
        name: var-lib-docker
  updateStrategy: {}

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: victorialogs
    app.kubernetes.io/managed-by: tilt-observability
