---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
  name: vector
  namespace: observability

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
  name: tilt-observability-vector
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
  name: tilt-observability-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tilt-observability-vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: observability

---
apiVersion: v1
data:
  vector.yaml: |
    api:
      enabled: true
      address: "0.0.0.0:8686"

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        self_node_name: "${VECTOR_SELF_NODE_NAME}"

    transforms:
      enrich_logs:
        type: remap
        inputs:
          - kubernetes_logs
        source: |
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
          .app = to_string(.kubernetes.pod_labels."app") ?? ""
          del(.kubernetes)
          del(.file)
          del(.source_type)

    sinks:
      victorialogs:
        type: elasticsearch
        inputs:
          - enrich_logs
        endpoints:
          - "http://victorialogs.observability.svc.cluster.local:9428/insert/elasticsearch/"
        api_version: v8
        mode: bulk
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: "namespace,pod,container,node,app"
kind: ConfigMap
metadata:
  labels:
    app: vector
    app.kubernetes.io/managed-by: tilt-observability
  name: vector-config
  namespace: observability
